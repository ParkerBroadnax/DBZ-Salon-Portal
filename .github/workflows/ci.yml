name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["8.1", "8.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_sqlite, pdo_mysql
      - run: composer install --no-interaction --no-progress
      - run: composer lint
      - run: composer test

  export-job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo, pdo_sqlite
      - name: Run the export end to end on SQLite
        env:
          DB_DSN: sqlite:var/salon.sqlite
        run: |
          php bin/init-db.php
          php bin/export-daily.php --date=2026-01-15
          php bin/export-daily.php --date=2026-01-15   # rerun must be idempotent
          python3 scripts/summarize_exports.py exports
